[build]
  command = "npx pnpm@latest install && npx pnpm@latest run build"
  publish = "artifacts/suivi-retraits/dist/public"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["artifacts/api-server/**"]
